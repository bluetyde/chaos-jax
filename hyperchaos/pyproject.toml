[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperchaos-catalogue"
version = "0.0.0"
description = "A verified catalogue of the smallest chaotic and hyperchaotic flows"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
