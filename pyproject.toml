[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaos-jax"
version = "0.0.0"
description = "Measuring when gradients through chaotic simulations fail in JAX, and which fixes work"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
